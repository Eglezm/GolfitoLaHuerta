<!doctype html>
<html lang="es">
<head>

<style>
/* Layout: lienzo 3D a pantalla completa con marcador estilo tablero de club en la parte superior y botonera de golpe abajo */
:root {
  --ink: #f4f0e2;          /* texto crema */
  --ink-dim: #c9c6b4;
  --panel: rgba(14, 30, 20, 0.78);   /* vidrio verde bosque */
  --panel-edge: rgba(244, 240, 226, 0.14);
  --flag: #f2c230;         /* amarillo bandera */
  --danger: #e0583a;
  --good: #8fd16a;
  --bg: #0e1e14;
  --f-display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
#game { position: fixed; inset: 0; }
#c { display: block; width: 100%; height: 100%; }
.hud { position: fixed; left: 0; right: 0; display: flex; gap: 10px; padding-inline: 12px; pointer-events: none; }
.hud.top { top: 0; padding-top: calc(env(safe-area-inset-top, 0px) + 10px); justify-content: space-between; align-items: flex-start; }
.card { background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 10px; padding: 8px 12px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
[hidden] { display: none !important; }
.score { display: grid; grid-template-columns: repeat(3, auto); column-gap: 16px; row-gap: 2px; }
.score .sub { grid-column: 1 / -1; margin-bottom: 4px; }
.stat { display: flex; flex-direction: column; min-width: 0; white-space: nowrap; }
.score .name { grid-column: 1 / -1; font-family: var(--f-display); font-weight: 700; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--flag); }
.lbl { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-dim); }
.val { font-family: var(--f-display); font-weight: 600; font-size: 20px; font-variant-numeric: tabular-nums; }
.wind { display: flex; gap: 10px; align-items: center; }
.wind svg { width: 34px; height: 34px; transition: transform .3s; }
.right-col { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
#map { width: 96px; height: 180px; border-radius: 8px; border: 1px solid var(--panel-edge); background: var(--panel); }
.hud.bottom { bottom: 0; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); flex-direction: column; align-items: center; }
.controls { pointer-events: auto; display: flex; flex-direction: column; gap: 8px; width: min(520px, 100%); }
.row { display: flex; gap: 8px; align-items: stretch; }
.club { flex: 1; display: flex; align-items: center; gap: 4px; padding: 4px; }
.club .mid { flex: 1; text-align: center; min-width: 0; }
.club .mid .val { font-size: 22px; line-height: 1.1; }
button { font: inherit; color: var(--ink); background: transparent; border: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--flag); outline-offset: 2px; }
.arrow { width: 40px; height: 44px; border-radius: 8px; font-size: 22px; background: rgba(244,240,226,.08); }
.arrow:active { background: rgba(244,240,226,.18); }
#swing { flex: 0 0 132px; border-radius: 10px; background: var(--flag); color: #1b1a12; font-family: var(--f-display); font-weight: 700; font-size: 20px; letter-spacing: .08em; text-transform: uppercase; box-shadow: 0 2px 0 #9c7a12; }
#swing:active { transform: translateY(2px); box-shadow: none; }
#swing:disabled { opacity: .45; }
.meter { position: relative; height: 26px; padding: 0; overflow: hidden; }
.meter .track { position: absolute; inset: 5px 8px; border-radius: 4px; background: linear-gradient(90deg, rgba(244,240,226,.12), rgba(242,194,48,.55) 85%, var(--danger)); }
.meter .acc { position: absolute; top: 2px; bottom: 2px; width: 8px; margin-left: -4px; background: var(--good); border-radius: 2px; }
.meter .pw { position: absolute; top: 2px; bottom: 2px; width: 3px; margin-left: -1px; background: var(--ink); opacity: 0; }
.meter .mk { position: absolute; top: 0; bottom: 0; width: 4px; margin-left: -2px; background: #fff; box-shadow: 0 0 6px #fff; border-radius: 2px; }
.meter .read { position: absolute; right: 12px; top: 3px; font-family: var(--f-display); font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px #000; }
#toast { position: fixed; left: 50%; top: 34%; transform: translate(-50%, -50%); padding: 10px 18px; font-family: var(--f-display); font-weight: 600; font-size: 18px; text-align: center; pointer-events: none; transition: opacity .3s; max-width: calc(100% - 32px); }
#hint { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 200px); transform: translateX(-50%); font-size: 13px; color: var(--ink); text-align: center; pointer-events: none; max-width: calc(100% - 32px); text-shadow: 0 1px 3px #000; }
#overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(8, 16, 10, .6); padding-inline: 16px; overflow-y: auto; }
#overlay .card { padding: 22px 22px; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; width: min(440px, 100%); }
#overlay h2 { margin: 0; font-family: var(--f-display); font-size: 40px; font-weight: 700; letter-spacing: .04em; color: var(--flag); text-wrap: balance; line-height: 1.05; }
#overlay p { margin: 0; color: var(--ink-dim); max-width: 34ch; }
.primary { margin-top: 4px; padding: 10px 22px; border-radius: 8px; background: var(--flag); color: #1b1a12; font-family: var(--f-display); font-weight: 700; font-size: 18px; letter-spacing: .06em; text-transform: uppercase; }
.tees { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.tee-btn { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--panel-edge); font-family: var(--f-display); font-weight: 600; font-size: 16px; }
.tee-btn[aria-pressed="true"] { border-color: var(--flag); background: rgba(242,194,48,.14); }
.tee-btn i { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,.4); }
.tee-btn small { font-family: var(--f-body); font-weight: 400; color: var(--ink-dim); font-size: 12px; }
.sc-wrap { width: 100%; overflow-x: auto; }
#courseMap { width: min(260px, 100%); aspect-ratio: 13 / 10; border-radius: 8px; border: 1px solid var(--panel-edge); }
table.sc { border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; margin-inline: auto; }
table.sc th, table.sc td { padding: 4px 6px; text-align: center; border-bottom: 1px solid var(--panel-edge); }
table.sc th { font-weight: 500; color: var(--ink-dim); text-align: left; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
table.sc tr.hd td { background: rgba(244,240,226,.06); font-weight: 600; }
table.sc td.cur { outline: 1px solid var(--flag); }
table.sc .u { color: var(--good); } table.sc .o { color: var(--danger); }
@media (max-width: 420px) { .val { font-size: 17px; } #map { width: 74px; height: 140px; } #swing { flex-basis: 108px; font-size: 17px; } table.sc th, table.sc td { padding: 3px 3px; } table.sc { font-size: 12px; } #overlay .card { padding: 16px 12px; } }
@media (prefers-reduced-motion: reduce) { .wind svg { transition: none; } }
</style>
</head>
<body>


<div id="game">
  <canvas id="c" aria-label="Campo de golf en 3D"></canvas>

  <div class="hud top">
    <div class="card score" aria-live="polite">
      <div class="name" id="holeName">Golfito La Huerta · Hoyo 1</div>
      <div class="sub lbl" id="holeSub">Par 4 · 257 yd · Ventaja 4</div>
      <div class="stat"><span class="lbl">Al hoyo</span><span class="val" id="dist">—</span></div>
      <div class="stat"><span class="lbl">Golpes</span><span class="val" id="strokes">0</span></div>
      <div class="stat"><span class="lbl">Bola en</span><span class="val" id="lie">Tee</span></div>
    </div>
    <div class="right-col">
      <div class="card wind">
        <svg viewBox="0 0 34 34" id="windArrow" aria-hidden="true"><circle cx="17" cy="17" r="15" fill="none" stroke="rgba(244,240,226,.25)"/><path d="M17 5 L24 16 H19.5 V29 H14.5 V16 H10 Z" fill="#f2c230"/></svg>
        <div><div class="val" id="windSpd">0</div><div class="lbl" id="windLbl">viento m/s</div></div>
      </div>
      <canvas id="map" width="192" height="360" aria-label="Mapa del hoyo"></canvas>
    </div>
  </div>

  <div id="toast" class="card" style="opacity:0"></div>
  <div id="hint">Arrastra para apuntar · Pulsa GOLPEAR tres veces: iniciar, potencia y precisión</div>

  <div class="hud bottom">
    <div class="controls">
      <div class="card meter" id="meter">
        <div class="track"></div>
        <div class="acc" id="accZone"></div>
        <div class="pw" id="pwMark"></div>
        <div class="mk" id="marker"></div>
        <div class="read" id="meterRead"></div>
      </div>
      <div class="row">
        <div class="card club">
          <button class="arrow" id="clubPrev" aria-label="Palo anterior">‹</button>
          <div class="mid"><div class="val" id="clubName">Driver</div><div class="lbl" id="clubRange">vuelo ≈ 250 yd</div></div>
          <button class="arrow" id="clubNext" aria-label="Palo siguiente">›</button>
        </div>
        <button id="swing">Golpear</button>
      </div>
    </div>
  </div>

  <div id="overlay">
    <div class="card" id="ovCard">
      <div class="lbl" id="ovEyebrow">Golf &amp; Hotel La Huerta · Puebla · 2158 m</div>
      <h2 id="ovTitle">Golfito La Huerta</h2>
      <p id="ovText">9 hoyos · par 29. Elige tus salidas.</p>
      <div class="tees" id="teePick">
        <button class="tee-btn" data-tee="0" aria-pressed="false"><i style="background:#d23a2a"></i>Rojas <small>1216 yd</small></button>
        <button class="tee-btn" data-tee="1" aria-pressed="true"><i style="background:#f4f4f4"></i>Blancas <small>1294 yd</small></button>
        <button class="tee-btn" data-tee="2" aria-pressed="false"><i style="background:#2c5fd0"></i>Azules <small>1409 yd</small></button>
      </div>
      <canvas id="courseMap" width="520" height="400" aria-label="Mapa del campo con los 9 hoyos"></canvas>
      <div class="sc-wrap" id="scWrap" hidden></div>
      <button class="primary" id="ovBtn">Empezar</button>
    </div>
  </div>
</div>

<script src="three.min.js"></script>
<script>
(() => {
'use strict';
// ───────────────────────── Constantes físicas (SI) ─────────────────────────
// Densidad del aire en La Huerta (Puebla, ≈ 2158 m, ≈ 20 °C): ≈ 0,93 kg/m³ frente a 1,225 a nivel del mar.
const G = 9.81, RHO = 0.93, BR = 0.021335, BM = 0.04593, BA = Math.PI * BR * BR;
const CUP_R = 0.054, YD = 1.0936133;
// Superficies: rebote (e), fricción de deslizamiento (mu), resistencia a la rodadura (roll)
const SURF = {
  TEE:     { name: 'Tee',     e: 0.50, mu: 0.50, roll: 0.16 },
  FAIRWAY: { name: 'Calle',   e: 0.48, mu: 0.50, roll: 0.15 },
  ROUGH:   { name: 'Rough',   e: 0.30, mu: 0.70, roll: 0.38 },
  BUNKER:  { name: 'Búnker',  e: 0.07, mu: 0.90, roll: 0.75 },
  GREEN:   { name: 'Green',   e: 0.40, mu: 0.55, roll: 0.058 },
  FRINGE:  { name: 'Antegreen', e: 0.44, mu: 0.50, roll: 0.10 },
  WATER:   { name: 'Agua' },
  OB:      { name: 'Fuera de límites' },
};
// Palos: velocidad de bola máxima (m/s), ángulo de salida (°), giro (rpm)
const CLUBS = [
  { name: 'Driver',    v: 70.0, la: 11.5, rpm: 2700 },
  { name: 'Madera 3',  v: 65.5, la: 10.5, rpm: 3600 },
  { name: 'Híbrido 4', v: 60.0, la: 12.5, rpm: 4500 },
  { name: 'Hierro 5',  v: 56.5, la: 12.5, rpm: 5300 },
  { name: 'Hierro 6',  v: 53.5, la: 14.0, rpm: 6200 },
  { name: 'Hierro 7',  v: 50.5, la: 16.3, rpm: 7000 },
  { name: 'Hierro 8',  v: 48.0, la: 18.0, rpm: 7900 },
  { name: 'Hierro 9',  v: 45.5, la: 20.5, rpm: 8600 },
  { name: 'Wedge PW',  v: 42.5, la: 24.0, rpm: 9300 },
  { name: 'Wedge SW',  v: 34.0, la: 31.0, rpm: 10000 },
  { name: 'Putter',    v: 6.5,  la: 0,    rpm: 0, putter: true },
];

// ───────────────────────── Golfito La Huerta: datos de la tarjeta ─────────────────────────
// Distancias en yardas por salida [rojas, blancas, azules], par y ventaja según la tarjeta oficial.
// La forma de cada hoyo (curva, búnkeres, agua) es provisional hasta tener el trazado real.
// Obstáculos: g = junto al green (dx a la derecha, dz hacia el fondo, en metros); s = en la calle (fracción del recorrido, off lateral).
const TEESETS = [{ name: 'Rojas', color: 0xd23a2a }, { name: 'Blancas', color: 0xf4f4f4 }, { name: 'Azules', color: 0x2c5fd0 }];
const HOLES = [
  { par: 4, hcp: 4,  yd: [250, 257, 265], pin: [-2, 3], slope: [0.006, 0.02],
    // Hoyo 1 (según Enrique): "El Abuelo", árbol enorme a ~80 yd del green a la derecha de la calle (la foto lo muestra casi sobre la línea de juego);
    // búnker centrado delante del green, con pasos estrechos a izquierda y derecha para entrar rodando.
    landmarks: [{ name: 'El Abuelo', toGreen: 80, off: 6, h: 19, r: 6.5 }],
    bunkers: [{ g: 1, dx: 0, dz: -19.5, rx: 8.5, rz: 3.2 }] },
  // Hoyo 2 (según Enrique y su foto): salida muy estrecha entre árboles; green ancho y poco profundo,
  // búnker delante; si te pasas, una caída fuerte detrás del green aleja la bola.
  { par: 3, hcp: 16, yd: [78, 84, 97], pin: [-3, 1], slope: [-0.01, 0.02], green: [13, 8.5], wide: 7.5, backDrop: 4,
    bunkers: [{ g: 1, dx: 3, dz: -12, rx: 8, rz: 3 }] },
  // Hoyo 3 (según Enrique y su foto): lago delante del green que tapa casi toda la entrada; solo queda
  // un paso de ~1,5 m a la derecha para llegar rodando, y más a la derecha están los árboles que lo separan del 1.
  { par: 3, hcp: 6,  yd: [116, 124, 136], pin: [0, 1], slope: [0.008, 0.018], green: [9.5, 8.5], wide: 6,
    ponds: [{ g: 1, dx: -3.5, dz: -20, rx: 9, rz: 7.5 }] },
  // Hoyo 4 (según Enrique y su foto): sales de una pequeña meseta; un lago ancho cubre todo el frente
  // y hay que cruzarlo por fuerza; el green empieza unos 2 m después del agua. Detrás del green, un búnker
  // metido en una pendiente que sube (backDrop negativo = subida), del que cuesta salir.
  { par: 3, hcp: 18, yd: [67, 72, 87], pin: [0, 1], slope: [0, 0.02], green: [9, 7], teeRise: 2.5, backDrop: -2.5,
    ponds: [{ g: 1, dx: 0, dz: -24, rx: 22, rz: 15 }], bunkers: [{ g: 1, dx: 0, dz: 11, rx: 7, rz: 3 }] },
  // Hoyo 5 (según Enrique y su foto): el lago que comparte con el 3 está justo delante del tee (solo lo
  // encuentra un golpe muy corto); búnker delante del green que obliga a volarlo, otro pequeño a la
  // izquierda, y a la derecha del green una pendiente que baja si no te quedas arriba.
  { par: 3, hcp: 12, yd: [95, 104, 115], pin: [-1, 1], slope: [-0.01, 0.015], green: [9, 10], rightDrop: 2,
    ponds: [{ fromTee: 0, off: 14, rx: 7, rz: 9 }],
    bunkers: [{ g: 1, dx: -2, dz: -14, rx: 8, rz: 3.5 }, { g: 1, dx: -11.5, dz: 2, rx: 2.5, rz: 4 }] },
  // Hoyo 6 (según Enrique y su foto): dogleg a la derecha con calle entre árboles a ambos lados; pasada la
  // línea de árboles es fuera de límites. Desde el quiebre, un lago a la derecha de la línea tapa casi todo:
  // solo quedan 3-4 m por la izquierda antes de los árboles, aunque lo normal es volarlo. Tras el lago, calle
  // (antes era un búnker enorme). Green que sube de la entrada al fondo; 5-6 m detrás ya es fuera de límites.
  { par: 4, hcp: 2,  yd: [316, 326, 336], pin: [0, 2], slope: [0.005, 0.035], wide: 12, ob: 22, backOB: 5.5,
    ponds: [{ afterCorner: 16, off: 4, rx: 12, rz: 10 }],
    landmarks: [30, 38, 46, 54, 62].map((y, k) => ({ toGreen: y, off: -7 - (k % 2), h: 12 + k, r: 3.2 })) },
  // Hoyo 7 (según Enrique y su foto): estrecho, sales de una pequeña meseta; búnker delante y otro a la
  // izquierda del green; green que sube de la entrada al fondo con una pequeña caída detrás; a la derecha
  // del green el terreno cae hacia los árboles y el fuera de límites, que está en el límite del arbolado.
  { par: 3, hcp: 10, yd: [92, 108, 118], pin: [-1, 2], slope: [0, 0.03], green: [9, 11], wide: 8, teeRise: 2,
    backDrop: 1.2, rightDrop: 3, obRight: 15,
    bunkers: [{ g: 1, dx: 2, dz: -14, rx: 6, rz: 3 }, { g: 1, dx: -11.5, dz: 3, rx: 3, rz: 4.5 }] },
  // Hoyo 8 (según Enrique y su foto): salida escondida; árboles que se meten en la calle por la izquierda
  // y una palmera a la derecha obligan a tirar muy recto; búnker a cada lado del green; green que sube de
  // la entrada al fondo y, si te pasas, una caída importante.
  { par: 3, hcp: 14, yd: [90, 97, 116], pin: [1, 2], slope: [0, 0.03], green: [10, 10], wide: 9, backDrop: 3,
    landmarks: [{ toGreen: 78, off: -5, h: 13, r: 4 }, { toGreen: 68, off: -4.5, h: 15, r: 4.5 }, { toGreen: 58, off: -6, h: 12, r: 3.5 },
                { name: 'Palmera', palm: true, toGreen: 62, off: 4.5, h: 11, r: 2.4 }],
    bunkers: [{ g: 1, dx: 13.5, dz: 1, rx: 4, rz: 6 }, { g: 1, dx: -12.5, dz: -1, rx: 3, rz: 5 }] },
  // Hoyo 9 (según Enrique y su foto): salida muy estrecha; a la derecha árboles y una palmera muy metida en
  // la calle, a la izquierda árboles y el techo de la nave del pádel; pasado el pádel la calle se abre.
  // Green en una pequeña meseta que cae a derecha, izquierda y fondo; búnker delante y otro a la izquierda,
  // ambos a ~1 m del green.
  // A la izquierda de la salida de blancas hay un jardín de eventos (claro sin árboles) y después el pádel.
  { par: 3, hcp: 8,  yd: [112, 122, 139], pin: [0, 1], slope: [0, 0.015], green: [9, 10], rise: 2,
    wide: 5.5, wideAfter: [50, 12], fwFrom: 50, leftDrop: 2.3, rightDrop: 2.3, backDrop: 2.3,
    landmarks: [{ name: 'Palmera', palm: true, fromTee: 26, off: 3, h: 10, r: 2.4 }],
    clearings: [{ fromTee: 2, off: -11, w: 12, l: 14 }],
    buildings: [{ name: 'pádel', fromTee: 27, off: -11.5, w: 10, l: 20, h: 6.5 }],
    bunkers: [{ g: 1, dx: 0, dz: -14, rx: 6, rz: 3 }, { g: 1, dx: -13, dz: 0, rx: 3, rz: 5 }] },
];
const PAR_TOTAL = HOLES.reduce((a, h) => a + h.par, 0);
// Centros de green reales (aportados por Enrique). Los tees se estiman: cada hoyo sale cerca del green anterior,
// a la distancia de la tarjeta (salidas blancas). Si se consiguen las coordenadas reales de los tees, van en TEES_LL.
const GREENS_LL = [
  [19.0601039, -98.3301499], [19.0598427, -98.3300061], [19.058892, -98.3310967],
  [19.058652, -98.3307404], [19.0596076, -98.3300105], [19.0585069, -98.3313680],
  [19.059541, -98.3316322], [19.0597324, -98.3309748], [19.0588899, -98.3317317],
];
// Salidas reales (aportadas por Enrique, convertidas de grados-minutos-segundos)
const TEES_LL = [
  [19.0586056, -98.3318167], [19.0603250, -98.3295528], [19.0597611, -98.3302500],
  [19.0586750, -98.3314750], [19.0589667, -98.3305028], [19.0599111, -98.3296778],
  [19.0587056, -98.3321333], [19.0602500, -98.3303611], [19.0599278, -98.3311056],
];
// Puntos de quiebre de los doglegs (aportados por Enrique)
const CORNERS_LL = { 5: [19.0583248, -98.33006978] };
const ORIGIN = [19.0592, -98.3309];
const toEN = ([lat, lng]) => ({ e: (lng - ORIGIN[1]) * 111320 * Math.cos(ORIGIN[0] * Math.PI / 180), n: (lat - ORIGIN[0]) * 110574 });
const COURSE = HOLES.map((h, i) => {
  const g = toEN(GREENS_LL[i]), pg = toEN(GREENS_LL[(i + HOLES.length - 1) % HOLES.length]), L = h.yd[1] / 1.0936133;

    c.beginPath(); c.moveTo(X(h.tee.e), Y(h.tee.n)); if (h.corner) c.lineTo(X(h.corner.e), Y(h.corner.n)); c.lineTo(X(h.green.e), Y(h.green.n)); c.stroke();
    c.fillStyle = on ? '#f2c230' : '#6ebe50'; c.beginPath(); c.arc(X(h.green.e), Y(h.green.n), on ? 11 : 9, 0, 7); c.fill();
    c.fillStyle = '#f4f0e2'; c.beginPath(); c.arc(X(h.tee.e), Y(h.tee.n), 11, 0, 7); c.fill();
    c.fillStyle = '#14281a'; c.font = '600 14px "Barlow Semi Condensed", sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(String(i + 1), X(h.tee.e), Y(h.tee.n) + 1);

}
function showOverlay({ eyebrow, title, text, button, tees, card, map }) {
  $('courseMap').hidden = map == null; if (map != null) drawCourseMap(map);
  $('ovEyebrow').textContent = eyebrow; $('ovTitle').textContent = title; $('ovText').textContent = text;
  $('ovBtn').textContent = button; $('teePick').hidden = !tees;
  $('scWrap').hidden = card == null; if (card != null) $('scWrap').innerHTML = card;
  $('overlay').hidden = false;
}
function showHoleResult() {
  const i = game.hole, last = i === HOLES.length - 1, c = scorecardHTML(i);
  if (!last) {
    showOverlay({ eyebrow: `Hoyo ${i + 1} terminado`, title: scoreName(game.strokes - holeSpec.par, game.strokes), text: `${game.strokes} golpe${game.strokes > 1 ? 's' : ''} · par ${holeSpec.par}`, button: `Ir al hoyo ${i + 2}`, card: c.html, map: i + 1 });
  } else {
    const d = c.tot - c.totPar;
    showOverlay({ eyebrow: 'Ronda terminada', title: `${c.tot} golpes`, text: d === 0 ? `Par del campo (${PAR_TOTAL})` : `${d > 0 ? '+' : ''}${d} sobre par ${PAR_TOTAL}`, button: 'Jugar otra ronda', tees: true, card: c.html, map: -1 });
  }
}
$('ovBtn').onclick = () => {
  if (game.state === 'done' && game.hole < HOLES.length - 1) startHole(game.hole + 1);
  else { game.scores = []; game.windDir = Math.random() * Math.PI * 2; game.windSpeed = 0.5 + Math.random() * 4.5; startHole(0); }
};
document.querySelectorAll('.tee-btn').forEach(b => b.onclick = () => {
  game.tee = +b.dataset.tee;
  document.querySelectorAll('.tee-btn').forEach(o => o.setAttribute('aria-pressed', o === b ? 'true' : 'false'));
});

// ───────────────────────── Interfaz ─────────────────────────
let toastT = 0;
function toast(msg, ms) { const t = $('toast'); t.textContent = msg; t.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => t.style.opacity = 0, ms); }
function updateHUD() {
  $('dist').textContent = yd(distToPin());
  $('strokes').textContent = game.strokes;
  $('lie').textContent = ball.surf.name || '';
  const c = CLUBS[game.club];
  $('clubName').textContent = c.name;
  $('clubRange').textContent = c.putter ? 'máx ≈ ' + yd(c.v * c.v / (2 * SURF.GREEN.roll * G)) + ' en green' : 'vuelo ≈ ' + yd(c.carry * lieFactor(c).v);
  const rel = (wind.dir - game.aim) * 180 / Math.PI;
  $('windArrow').style.transform = `rotate(${rel}deg)`;
  $('windSpd').textContent = wind.speed.toFixed(1); $('windLbl').textContent = 'm/s · del ' + compass(wind.world + Math.PI);
}
function updateAim() {
  const c = CLUBS[game.club], f = fwd(game.aim);
  const len = c.putter ? Math.min(distToPin(), 30) : c.carry * lieFactor(c).v;
  const arr = aimGeo.attributes.position.array, N = 100;
  for (let i = 0; i < N; i++) {
    const t = (i / (N - 1)) * len, x = ball.p.x + f.x * t, z = ball.p.z + f.z * t;
    arr[i * 3] = x; arr[i * 3 + 1] = H(x, z) + 0.06; arr[i * 3 + 2] = z;
  }
  aimN = N;
  const tx = ball.p.x + f.x * len, tz = ball.p.z + f.z * len;
  ring.position.set(tx, H(tx, tz) + 0.08, tz); ring.scale.setScalar(c.putter ? 0.15 : Math.max(1.5, len / 40));
  aimDash = c.putter ? 2 : 3;
  updateHUD();
}
function setClub(i) { if (game.state !== 'aim' || meter.phase !== 'idle') return; game.club = (i + CLUBS.length) % CLUBS.length; updateAim(); }
$('clubPrev').onclick = () => setClub(game.club - 1);
$('clubNext').onclick = () => setClub(game.club + 1);

function swingTap() {
  if (game.state !== 'aim') return;
  if (meter.phase === 'idle') { meter.phase = 'up'; meter.pos = 0; $('pwMark').style.opacity = 0; }
  else if (meter.phase === 'up' || meter.phase === 'top') { meter.power = Math.max(0.03, Math.min(1, meter.pos)); meter.phase = 'down'; $('pwMark').style.left = mPct(meter.power); $('pwMark').style.opacity = 1; }
  else if (meter.phase === 'down') { fire(meter.pos); }
}
function fire(pos) {
  const err = Math.max(-1, Math.min(1, (pos - meter.ACC) / 0.1));
  meter.phase = 'idle';
  shoot(meter.power, Math.abs(err) < 0.25 ? err * 0.3 : err);
}
const mPct = p => ((p - meter.MIN) / (1 - meter.MIN) * 100) + '%';
$('accZone').style.left = mPct(meter.ACC);
$('swing').addEventListener('pointerdown', e => { e.preventDefault(); swingTap(); });
window.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); swingTap(); }
  if (game.state !== 'aim' || meter.phase !== 'idle') return;
  const fine = CLUBS[game.club].putter ? 0.004 : 0.012;
  if (e.key === 'ArrowLeft') { game.aim -= fine; updateAim(); }
  if (e.key === 'ArrowRight') { game.aim += fine; updateAim(); }
  if (e.key === 'ArrowUp') setClub(game.club - 1);
  if (e.key === 'ArrowDown') setClub(game.club + 1);
});
let drag = null;
canvas.addEventListener('pointerdown', e => { drag = { x: e.clientX }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => {
  if (!drag || game.state !== 'aim' || meter.phase !== 'idle') return;
  const k = CLUBS[game.club].putter ? 0.0012 : 0.003;
  game.aim += (e.clientX - drag.x) * k; drag.x = e.clientX; updateAim();
});
canvas.addEventListener('pointerup', () => { drag = null; });

// Minimapa (se ajusta a cada hoyo)
const map = $('map'), mctx = map.getContext('2d');
const MAP = { x0: 0, z0: 0, k: 1, ox: 0 };
const mx = x => MAP.ox + (x - MAP.x0) * MAP.k, mz = z => (MAP.z0 - z) * MAP.k;
const mapBg = document.createElement('canvas'); mapBg.width = map.width; mapBg.height = map.height;
function drawMapBg() {
  const xs = CENTER.map(c => c[0]), zs = CENTER.map(c => c[1]);
  const x0 = Math.min(...xs) - 30, x1 = Math.max(...xs) + 30, z0 = Math.max(...zs) + 10, z1 = Math.min(...zs) - 25;
  MAP.k = Math.min(map.width / (x1 - x0), map.height / (z0 - z1));
  MAP.x0 = x0; MAP.z0 = z0; MAP.ox = (map.width - (x1 - x0) * MAP.k) / 2;
  const g = mapBg.getContext('2d'), img = g.createImageData(map.width, map.height);
  for (let j = 0; j < map.height; j++) for (let i = 0; i < map.width; i++) {
    const x = MAP.x0 + (i + 0.5 - MAP.ox) / MAP.k, z = MAP.z0 - (j + 0.5) / MAP.k;
    const s = surfAt(x, z);
    const c = s === SURF.GREEN || s === SURF.FRINGE ? [110, 190, 80] : s === SURF.FAIRWAY || s === SURF.TEE ? [80, 150, 55] : s === SURF.BUNKER ? [225, 208, 160]
      : s === SURF.WATER ? [60, 130, 170] : s === SURF.OB ? [30, 50, 30] : [45, 90, 35];
    const k = (j * map.width + i) * 4; img.data[k] = c[0]; img.data[k + 1] = c[1]; img.data[k + 2] = c[2]; img.data[k + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  g.fillStyle = 'rgba(15,50,20,.85)';
  for (const t of trees) { g.beginPath(); g.arc(mx(t.x), mz(t.z), Math.max(1.2, t.r * MAP.k * 0.6), 0, 7); g.fill(); }
}
function drawMap() {
  mctx.drawImage(mapBg, 0, 0);
  mctx.fillStyle = '#f2c230'; mctx.fillRect(mx(PIN.x) - 1, mz(PIN.z) - 8, 2, 8); mctx.fillRect(mx(PIN.x), mz(PIN.z) - 8, 6, 4);
  if (game.state === 'aim') {
    const c = CLUBS[game.club], f = fwd(game.aim), len = c.putter ? Math.min(distToPin(), 30) : c.carry * lieFactor(c).v;
    mctx.strokeStyle = 'rgba(242,194,48,.9)'; mctx.lineWidth = 2; mctx.setLineDash([4, 3]);
    mctx.beginPath(); mctx.moveTo(mx(ball.p.x), mz(ball.p.z)); mctx.lineTo(mx(ball.p.x + f.x * len), mz(ball.p.z + f.z * len)); mctx.stroke(); mctx.setLineDash([]);
  }
  mctx.fillStyle = '#fff'; mctx.strokeStyle = '#000'; mctx.lineWidth = 1.5;
  mctx.beginPath(); mctx.arc(mx(ball.p.x), mz(ball.p.z), 4, 0, 7); mctx.fill(); mctx.stroke();
  // Norte real según el rumbo del hoyo
  const B = COURSE[game.hole].bearing, nx = map.width - 18, ny = 20;
  mctx.save(); mctx.translate(nx, ny); mctx.rotate(-B);
  mctx.fillStyle = 'rgba(14,30,20,.8)'; mctx.beginPath(); mctx.arc(0, 0, 13, 0, 7); mctx.fill();
  mctx.fillStyle = '#f4f0e2'; mctx.beginPath(); mctx.moveTo(0, -10); mctx.lineTo(5, 3); mctx.lineTo(-5, 3); mctx.fill();
  mctx.font = '600 11px sans-serif'; mctx.textAlign = 'center'; mctx.fillText('N', 0, 12); mctx.restore();
}

// ───────────────────────── Bucle ─────────────────────────
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();

const camPos = new THREE.Vector3(0, 3, 6), camLook = new THREE.Vector3(0, 0, -40), wantPos = new THREE.Vector3(), wantLook = new THREE.Vector3();
let last = performance.now(), acc = 0, hudT = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  // Medidor
  const c = CLUBS[game.club];
  const MS = c.putter ? 0.75 : 0.95; // unidades por segundo
  if (meter.phase === 'up') { meter.pos += dt * MS; if (meter.pos >= 1) { meter.pos = 1; meter.phase = 'top'; meter.topT = 0.12; } }
  else if (meter.phase === 'top') { meter.topT -= dt; if (meter.topT <= 0) { meter.power = 1; meter.phase = 'down'; $('pwMark').style.left = mPct(1); $('pwMark').style.opacity = 1; } }
  else if (meter.phase === 'down') { meter.pos -= dt * MS * 1.15; if (meter.pos <= meter.MIN) fire(meter.MIN); }
  $('marker').style.left = mPct(meter.pos);
  const shown = meter.phase === 'down' ? meter.power : meter.pos;
  $('meterRead').textContent = game.state !== 'aim' || meter.phase === 'idle' ? '' : c.putter
    ? '≈ ' + yd(Math.pow(c.v * shown * lieFactor(c).v, 2) / (2 * SURF.GREEN.roll * G))
    : Math.round(shown * 100) + '% · vuelo ≈ ' + yd(carryAt(c, Math.max(0.03, shown)) * lieFactor(c).v);

  // Física a 240 Hz
  if (game.state === 'flight') {
    acc += dt;
    while (acc > 1 / 240) {
      acc -= 1 / 240; step(1 / 240);
      if (ball.mode !== 'air' && ball.mode !== 'roll') break;
      if (trailN < TRAIL_MAX && ball.mode === 'air') { trailGeo.attributes.position.setXYZ(trailN++, ball.p.x, ball.p.y, ball.p.z); }
    }
    trailGeo.setDrawRange(0, trailN); trailGeo.attributes.position.needsUpdate = true;
    if (ball.mode === 'rest') { game.state = 'resting'; game.restTimer = game.holed ? 0.2 : 1.1; acc = 0; }
    hudT -= dt; if (hudT < 0) { updateHUD(); hudT = 0.15; }
  } else if (game.state === 'resting') {
    game.restTimer -= dt; if (game.restTimer <= 0) finishShot();
  }

  if (CENTER) {
    // Cámara
    const putting = c.putter;
    if (game.state === 'aim') {
      const f = fwd(game.aim);
      const back = putting ? 3.2 : 5, up = putting ? 1.3 : 1.9, ahead = putting ? 6 : 45;
      wantPos.copy(ball.p).addScaledVector(f, -back); wantPos.y = Math.max(ball.p.y, H(wantPos.x, wantPos.z)) + up;
      const lx = ball.p.x + f.x * ahead, lz = ball.p.z + f.z * ahead;
      wantLook.set(lx, (H(lx, lz) + ball.p.y) / 2 + (putting ? 0 : 1), lz);
      camPos.lerp(wantPos, Math.min(1, dt * 4)); camLook.lerp(wantLook, Math.min(1, dt * 4));
    } else if (game.state !== 'done' && game.state !== 'menu') {
      const hgt = ball.p.y - H(ball.p.x, ball.p.z);
      wantPos.copy(ball.p).addScaledVector(game.shotDir, putting ? -3 : -14); wantPos.y = ball.p.y + (putting ? 1.4 : 4 + hgt * 0.15);
      camPos.lerp(wantPos, Math.min(1, dt * (putting ? 3 : 1.4))); camLook.lerp(ball.p, Math.min(1, dt * 6));
    }
    camPos.y = Math.max(camPos.y, H(camPos.x, camPos.z) + 0.6);
    camera.position.copy(camPos); camera.lookAt(camLook);

    // Bola y elementos visuales
    ballMesh.position.copy(ball.p);
    const cd = camera.position.distanceTo(ball.p);
    ballMesh.scale.setScalar(Math.max(1, cd / 9));
    ballMark.position.copy(ball.p); ballMark.visible = cd > 18 && ball.mode !== 'penalty';
    ballMark.scale.setScalar(0.055 * (720 / Math.max(480, renderer.domElement.clientHeight)) ** 0.3);
    const gh = H(ball.p.x, ball.p.z); shadow.position.set(ball.p.x, gh + 0.01, ball.p.z);
    shadow.scale.setScalar(Math.max(1, cd / 14) * (1 + Math.min(3, (ball.p.y - gh) * 0.05))); shadow.visible = ball.p.y - gh < 60;
    const showAim = game.state === 'aim'; aimLine.visible = ring.visible = showAim; trail.visible = !showAim || trailN > 0;
    if (showAim) aimLine.update(aimN, camera, aimDash); if (trail.visible) trail.update(trailN, camera);
    flag.scale.setScalar(Math.max(1, camera.position.distanceTo(flag.position) / 55));

}
// Vista de fondo del menú: el hoyo 1 desde el tee
defineHole(0, 1); buildScene(0); placeBall(0, 0, true); aimAt(PIN.x, PIN.z);
camPos.set(0, 2.2, 6); camLook.set(PIN.x * 0.3, 2, -60);
drawCourseMap(0);
requestAnimationFrame(frame);
window.__golf = { ball, game, CLUBS, flatCarry, shoot, H, surfAt, startHole, HOLES, COURSE, get PIN() { return PIN; }, get CENTER() { return CENTER; } };
})();
</script>
